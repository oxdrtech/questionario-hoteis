<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel de Captação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<script>
  // Webhook do workflow painel-webhook.json no n8n
  const ENDPOINT = "https://main-n8n.6kc5ee.easypanel.host/webhook/painel";
  // Webhook (painel) do workflow capitacao-hoteis.json
  const ENDPOINT_CAPTAR = "https://main-n8n.6kc5ee.easypanel.host/webhook/captar";
</script>
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --ink:#15302c; --muted:#5b6f6b;
  --line:#d6e0dd; --accent:#0e6b5e; --accent-ink:#ffffff; --soft:#e3efec; --err:#b42318;
  --warn-bg:#fdf0dc; --warn-ink:#8a4b08; --hot:#c2410c;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --card:#16211f; --ink:#e4efec; --muted:#9db1ac;
  --line:#2a3a37; --accent:#4cc3ad; --accent-ink:#06201c; --soft:#1d2d2a; --err:#f97066;
  --warn-bg:#3a2a12; --warn-ink:#f6c37a; --hot:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --card:#16211f; --ink:#e4efec; --muted:#9db1ac;
  --line:#2a3a37; --accent:#4cc3ad; --accent-ink:#06201c; --soft:#1d2d2a; --err:#f97066;
  --warn-bg:#3a2a12; --warn-ink:#f6c37a; --hot:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font:400 clamp(32px,6vw,44px)/1.05 var(--display);margin:4px 0 0}
.sync{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
button,.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button[disabled]{opacity:.55;cursor:wait}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* Login */
.login{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;display:flex;flex-direction:column;gap:12px}
.login p{margin:0;color:var(--muted)}
.error{color:var(--err);font-size:14px;margin:0;min-height:1em}

/* Funil */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tab{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;text-align:left}
.tab b{font:400 28px/1 var(--display);font-variant-numeric:tabular-nums}
.tab span{font-size:12px;color:var(--muted);font-weight:600}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed="true"] span{color:inherit;opacity:.85}
.tab.alert:not([aria-pressed="true"]) b{color:var(--hot)}
@media (max-width:700px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.filters label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin-left:auto}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:48px 1fr;gap:4px 14px}
.score{grid-row:span 3;width:48px;height:48px;border-radius:10px;background:var(--soft);display:grid;place-items:center;
  font:400 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.score.top{background:var(--accent);color:var(--accent-ink)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.head h3{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.sinais{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-width:340px}
.sinal{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 4px 3px 9px;border-radius:8px;
  background:var(--bg);border:1px solid var(--line)}
.sinal b{margin-left:auto;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--muted)}
.sinal.pos b{background:var(--accent);color:var(--accent-ink)}
.sinal.neg{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}
.sinal.neg b{background:var(--warn-ink);color:var(--warn-bg)}
.btn.off{opacity:.38;cursor:not-allowed;filter:grayscale(1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink)}
.chip.late{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.quote{font-size:14px;font-style:italic;margin:4px 0 0;border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.actions{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.actions .sep{flex:1}
.actions .btn,.actions button,.actions select,.actions input{font-size:13px;padding:6px 10px}
.actions label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
@media (max-width:560px){.card{grid-template-columns:1fr}.score{grid-row:auto;width:auto;height:auto;padding:4px 10px;justify-self:start;font-size:20px}.actions{grid-column:1}.actions .sep{flex-basis:100%}}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.more{align-self:center}
/* Captação */
.captar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.captar h2{font:400 24px/1.1 var(--display);margin:0}
.captar textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:84px;resize:vertical;width:100%}
.captar .hint{font-size:13px;color:var(--muted);margin:0}
.tipos{display:flex;flex-wrap:wrap;gap:8px}
.tipos label{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px;cursor:pointer;background:var(--bg)}
.tipos input{accent-color:var(--accent)}
.captar .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Captação de hotéis</div>
      <h1>Painel do dia</h1>
    </div>
    <div class="sync" id="sync" hidden>
      <span id="updated"></span>
      <button type="button" id="abrirCaptar" aria-expanded="false">Buscar hotéis</button>
      <button type="button" id="reload">Atualizar</button>
      <button type="button" id="logout" title="Esquecer a senha neste aparelho">Sair</button>
    </div>
  </header>

  <form class="login" id="login" hidden>
    <p>Digite a senha definida no nó <b>Checar senha</b> do workflow do painel.</p>
    <input type="password" id="senha" autocomplete="current-password" placeholder="Senha" required>
    <button class="primary" type="submit">Entrar</button>
    <p class="error" id="loginErr"></p>
  </form>

  <main id="app" hidden>
    <form class="captar" id="captar" hidden style="margin-bottom:14px">
      <h2>Buscar novos hotéis</h2>
      <textarea id="cidades" placeholder="Uma cidade por linha, no formato Cidade UF&#10;Caruaru PE&#10;Gravatá PE" required></textarea>
      <div class="tipos" id="tipos">
        <label><input type="checkbox" value="pousada" checked> pousada</label>
        <label><input type="checkbox" value="hotel" checked> hotel</label>
        <label><input type="checkbox" value="hostel"> hostel</label>
        <label><input type="checkbox" value="motel"> motel</label>
        <label><input type="checkbox" value="chalé"> chalé</label>
      </div>
      <div class="row">
        <button class="primary" type="submit" id="buscar">Buscar</button>
        <p class="hint" id="custo"></p>
      </div>
    </form>
    <div class="tabs" id="tabs"></div>
    <div class="filters" style="margin-top:14px">
      <input type="search" id="q" placeholder="Buscar hotel, cidade ou motivo">
      <select id="cidade"><option value="">Todas as cidades</option></select>
      <label><input type="checkbox" id="soWhats"> Só com WhatsApp</label>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list" style="margin-top:14px"></div>
    <button type="button" class="more" id="more" hidden>Mostrar mais</button>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STATUS = ["Novo","Contatado","Entrevistado","Fechado","Descartado"];
const TABS = [
  {id:"Retornos", label:"Retornos hoje", alert:true},
  {id:"Novo", label:"Fila (novos)"},
  {id:"Contatado", label:"Contatados"},
  {id:"Entrevistado", label:"Entrevistados"},
  {id:"Fechado", label:"Fechados"},
  {id:"Descartado", label:"Descartados"},
];
const PAGE = 40;
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} },
};

let senha = store.get("painel_senha");
let leads = [], hoje = "", tab = store.get("painel_tab") || "", shown = PAGE;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData = d => d ? d.slice(0,10).split("-").reverse().join("/") : "";
const isRetorno = l => l.data_retorno && l.data_retorno.slice(0,10) <= hoje && !["Descartado","Fechado"].includes(l.status);

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3000);
}

async function api(body){
  const res = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({senha, ...body})});
  if (!res.ok) throw new Error(res.status === 500 ? "senha" : "HTTP " + res.status);
  let data = await res.json();
  if (Array.isArray(data)) data = data[0];
  let d = data && data.dados;
  if (typeof d === "string") d = JSON.parse(d);
  if (!d || !Array.isArray(d.leads)) throw new Error("resposta inesperada");
  leads = d.leads; hoje = String(d.hoje).slice(0,10);
  $("updated").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

async function load(){
  $("reload").disabled = true;
  try {
    await api({acao:"carregar"});
    showApp();
  } catch(e){
    if (e.message === "senha"){ senha = null; store.set("painel_senha", null); showLogin("Senha incorreta ou workflow do painel desativado."); }
    else toast("Não consegui carregar: " + e.message);
  } finally { $("reload").disabled = false; }
}

async function atualizar(ids, campos, msg){
  try {
    await api({acao:"atualizar", place_ids: ids, ...campos});
    render(); toast(msg);
  } catch(e){ toast("Não salvou: " + e.message); }
}

function showLogin(err){
  $("login").hidden = false; $("app").hidden = true; $("sync").hidden = true;
  $("loginErr").textContent = err || ""; $("senha").focus();
}
function showApp(){
  $("login").hidden = true; $("app").hidden = false; $("sync").hidden = false;
  const cidades = [...new Set(leads.map(l => l.cidade && l.uf ? `${l.cidade}/${l.uf}` : l.cidade).filter(Boolean))].sort();
  const sel = $("cidade"), atual = sel.value;
  sel.innerHTML = `<option value="">Todas as cidades</option>` + cidades.map(c => `<option${c===atual?" selected":""}>${esc(c)}</option>`).join("");
  if (!tab) tab = leads.some(isRetorno) ? "Retornos" : "Novo";
  render();
}

function filtrados(){
  const q = $("q").value.trim().toLowerCase(), cid = $("cidade").value, so = $("soWhats").checked;
  let arr = tab === "Retornos" ? leads.filter(isRetorno).sort((a,b) => a.data_retorno.localeCompare(b.data_retorno))
                               : leads.filter(l => l.status === tab);
  if (cid) arr = arr.filter(l => (l.cidade && l.uf ? `${l.cidade}/${l.uf}` : l.cidade) === cid);
  if (so) arr = arr.filter(l => l.whatsapp);
  if (q) arr = arr.filter(l => [l.nome,l.cidade,l.motivos,l.endereco].join(" ").toLowerCase().includes(q));
  return arr;
}

function render(){
  $("tabs").innerHTML = TABS.map(t => {
    const n = t.id === "Retornos" ? leads.filter(isRetorno).length : leads.filter(l => l.status === t.id).length;
    return `<button type="button" class="tab${t.alert && n ? " alert" : ""}" data-tab="${t.id}" aria-pressed="${t.id===tab}"><b>${n}</b><span>${t.label}</span></button>`;
  }).join("");

  const arr = filtrados();
  $("count").textContent = `${arr.length} ${arr.length === 1 ? "hotel" : "hotéis"}`;
  $("list").innerHTML = arr.length ? arr.slice(0, shown).map(card).join("")
    : `<div class="empty">${tab === "Retornos" ? "Nenhum retorno para hoje." : tab === "Novo" ? "A fila acabou. Rode a captação para buscar novas cidades." : "Nada por aqui."}</div>`;
  $("more").hidden = arr.length <= shown;
}

// Traduz os "motivos" do score em sinais visuais, com os pontos de cada um
const SINAIS = [
  {re:/^sem site$/,              emoji:"🌐", txt:"Sem site próprio",          pts:+3},
  {re:/^site é OTA/,             emoji:"🔗", txt:"Site é OTA/rede social",    pts:+3},
  {re:/^celular/,                emoji:"📱", txt:"WhatsApp provável",         pts:+2},
  {re:/^porte pequeno/,          emoji:"🏡", txt:"Porte pequeno/médio",       pts:+2},
  {re:/^nota abaixo/,            emoji:"⭐", txt:"Nota abaixo de 4,3",        pts:+1},
  {re:/^muito grande/,           emoji:"🏢", txt:"Grande demais (provável rede)", pts:-2},
  {re:/^sem telefone/,           emoji:"📵", txt:"Sem telefone",              pts:-2},
];
function sinais(l){
  const itens = String(l.motivos || "").split(";").map(s => s.trim()).filter(Boolean);
  if (!itens.length) return `<div class="sinais"></div>`;
  return `<ul class="sinais" aria-label="Por que esse score">${itens.map(m => {
    const s = SINAIS.find(x => x.re.test(m)) || {emoji:"•", txt:m, pts:0};
    let txt = s.txt;
    if (s.emoji === "🔗" && l.site){ try { txt = "Site é " + new URL(l.site).hostname.replace(/^www\./, ""); } catch(e){} }
    const cls = s.pts > 0 ? "pos" : s.pts < 0 ? "neg" : "";
    return `<li class="sinal ${cls}"><span aria-hidden="true">${s.emoji}</span> ${esc(txt)}${s.pts ? `<b>${s.pts > 0 ? "+" : "−"}${Math.abs(s.pts)}</b>` : ""}</li>`;
  }).join("")}</ul>`;
}
const temperaturaEmoji = t => /quent/i.test(t) ? "🔥" : /morn/i.test(t) ? "🌤️" : /fri/i.test(t) ? "🧊" : "🌡️";

function card(l){
  const tel = String(l.telefone || "").replace(/\D/g, "");
  const atrasado = l.data_retorno && l.data_retorno.slice(0,10) < hoje;
  const chips = [];
  if (tab === "Retornos") chips.push(`<span class="chip">📌 ${esc(l.status)}</span>`);
  if (l.nome_pessoa) chips.push(`<span class="chip">👤 ${esc(l.nome_pessoa)}</span>`);
  if (l.temperatura) chips.push(`<span class="chip">${temperaturaEmoji(l.temperatura)} ${esc(l.temperatura)}</span>`);
  if (l.proximo_passo) chips.push(`<span class="chip">➡️ ${esc(l.proximo_passo)}</span>`);
  if (l.data_retorno) chips.push(`<span class="chip${isRetorno(l) ? " late" : ""}">📅 Retorno ${fmtData(l.data_retorno)}${atrasado ? " (atrasado)" : ""}</span>`);
  if (l.dores_fortes) chips.push(`<span class="chip">😣 Dores: ${esc(l.dores_fortes)}</span>`);

  // Botões sempre visíveis; sem o dado, aparecem apagados
  const link = (ok, href, emoji, txt, falta, externo = true) => ok
    ? `<a class="btn" href="${esc(href)}"${externo ? ` target="_blank" rel="noopener"` : ""}><span aria-hidden="true">${emoji}</span> ${txt}</a>`
    : `<span class="btn off" aria-disabled="true" title="${falta}"><span aria-hidden="true">${emoji}</span> ${txt}</span>`;

  const rapido = {Novo:["Contatado","Contatei"], Contatado:["Novo","Voltar pra fila"], Entrevistado:["Fechado","Fechou"]}[l.status];
  return `<article class="card" data-id="${esc(l.place_id)}">
    <div class="score${l.score >= 6 ? " top" : ""}" title="Score de prioridade">${esc(l.score)}</div>
    <div class="head"><h3>${esc(l.nome)}</h3>
      <span class="meta">${esc([l.cidade, l.uf].filter(Boolean).join("/"))}${l.nota ? ` · ★ ${esc(l.nota)} (${esc(l.avaliacoes)})` : ""}${l.telefone ? ` · ${esc(l.telefone)}` : ""}</span></div>
    ${sinais(l)}
    <div>${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}${l.frase_chave ? `<p class="quote">“${esc(l.frase_chave)}”</p>` : ""}</div>
    <div class="actions">
      ${link(l.whatsapp, l.whatsapp, "💬", "WhatsApp", "Telefone não é celular")}
      ${link(tel, "tel:+55" + tel, "📞", "Ligar", "Sem telefone", false)}
      ${link(l.site, l.site, "🌐", "Site", "Sem site")}
      ${link(l.maps, l.maps, "📍", "Maps", "Sem link do Maps")}
      ${link(l.link_entrevista, l.link_entrevista, "📝", "Entrevista", "Sem link de entrevista")}
      <span class="sep"></span>
      <label>Retorno <input type="date" data-act="retorno" value="${esc((l.data_retorno||"").slice(0,10))}"></label>
      <select data-act="status" aria-label="Status">${STATUS.map(s => `<option${s===l.status?" selected":""}>${s}</option>`).join("")}</select>
      ${rapido ? `<button type="button" class="primary" data-act="rapido" data-status="${rapido[0]}">${rapido[1]}</button>` : ""}
    </div>
  </article>`;
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; store.set("painel_tab", tab); shown = PAGE; render();
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act=rapido]"); if (!b) return;
  const id = b.closest(".card").dataset.id, nome = b.closest(".card").querySelector("h3").textContent;
  b.disabled = true;
  atualizar([id], {status: b.dataset.status}, `${nome} → ${b.dataset.status}`);
});
$("list").addEventListener("change", e => {
  const el = e.target, c = el.closest(".card"); if (!c) return;
  const nome = c.querySelector("h3").textContent;
  if (el.dataset.act === "status") atualizar([c.dataset.id], {status: el.value}, `${nome} → ${el.value}`);
  if (el.dataset.act === "retorno") atualizar([c.dataset.id], {data_retorno: el.value}, el.value ? `Retorno de ${nome} em ${fmtData(el.value)}` : `Retorno de ${nome} removido`);
});
["q","cidade","soWhats"].forEach(id => $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("more").addEventListener("click", () => { shown += PAGE; render(); });
$("reload").addEventListener("click", load);
$("logout").addEventListener("click", () => { senha = null; store.set("painel_senha", null); showLogin(); });
$("login").addEventListener("submit", e => {
  e.preventDefault(); senha = $("senha").value.trim(); store.set("painel_senha", senha); load();
});

// ---- Captação: dispara o workflow capitacao-hoteis.json ----
const listaCidades = () => $("cidades").value.split("\n").map(s => s.trim()).filter(Boolean);
const listaTipos = () => [...$("tipos").querySelectorAll("input:checked")].map(i => i.value);
function atualizaCusto(){
  const n = listaCidades().length * listaTipos().length;
  $("custo").textContent = n ? `Vai usar ${n} ${n === 1 ? "requisição" : "requisições"} da RapidAPI (limite de 1.000 por mês).` : "";
}
$("cidades").addEventListener("input", atualizaCusto);
$("tipos").addEventListener("change", atualizaCusto);
$("abrirCaptar").addEventListener("click", () => {
  const f = $("captar"); f.hidden = !f.hidden;
  $("abrirCaptar").setAttribute("aria-expanded", String(!f.hidden));
  if (!f.hidden) $("cidades").focus();
});
$("captar").addEventListener("submit", async e => {
  e.preventDefault();
  const cidades = listaCidades(), tipos = listaTipos();
  if (!cidades.length || !tipos.length) return toast("Informe ao menos uma cidade e um tipo.");
  const b = $("buscar"); b.disabled = true; b.textContent = "Buscando…";
  try {
    const res = await fetch(ENDPOINT_CAPTAR, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({senha, cidades: cidades.join("\n"), tipos})});
    if (!res.ok) throw new Error(res.status === 500 ? "erro no workflow (senha ou chave da RapidAPI?)" : "HTTP " + res.status);
    const data = await res.json();
    const novos = (Array.isArray(data) ? data : [data]).filter(x => x && x.place_id).length;
    toast(novos ? `${novos} hotéis novos entraram na fila.` : "Nenhum hotel novo: todos já estavam no banco.");
    $("cidades").value = ""; atualizaCusto(); $("captar").hidden = true;
    tab = "Novo"; store.set("painel_tab", tab);
    await load();
  } catch(err){ toast("Busca falhou: " + err.message); }
  finally { b.disabled = false; b.textContent = "Buscar"; }
});

senha ? load() : showLogin();
</script>
</body>
</html>
